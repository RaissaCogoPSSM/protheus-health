services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: protheus_health
    ports:
      - "5432:5432"
    volumes:
      - protheus-health-db:/var/lib/postgresql/data

volumes:
  protheus-health-db:
